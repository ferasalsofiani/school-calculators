<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Calculator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .calculator {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            width: 320px;
        }
        #display {
            width: 100%;
            height: 70px;
            background: rgba(0, 0, 0, 0.2);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 2rem;
            text-align: right;
            padding: 0 15px;
            margin-bottom: 20px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        button {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 18px;
            font-size: 1.2rem;
            color: #fff;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: rgba(255, 255, 255, 0.3); transform: scale(1.05); }
        button:active { transform: scale(0.95); }
        .operator { background: rgba(255, 140, 0, 0.4); border-color: rgba(255, 140, 0, 0.6); }
        .operator:hover { background: rgba(255, 140, 0, 0.6); }
        .equal { background: rgba(0, 200, 100, 0.4); border-color: rgba(0, 200, 100, 0.6); grid-column: span 2; }
        .equal:hover { background: rgba(0, 200, 100, 0.6); }
        .clear { background: rgba(255, 50, 50, 0.4); border-color: rgba(255, 50, 50, 0.6); }
        .clear:hover { background: rgba(255, 50, 50, 0.6); }
    </style>
</head>
<body>
    <div class="calculator">
        <input type="text" id="display" readonly value="0">
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button onclick="appendValue('(')">(</button>
            <button onclick="appendValue(')')">)</button>
            <button class="operator" onclick="appendValue('/')">/</button>
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('*')">*</button>
            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="operator" onclick="appendValue('-')">-</button>
            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="operator" onclick="appendValue('+')">+</button>
            <button onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>
        </div>
    </div>
    <script>
        const display = document.getElementById('display');
        function appendValue(val) {
            if (display.value === '0' || display.value === 'Error') display.value = '';
            display.value += val;
        }
        function clearDisplay() { display.value = '0'; }
        function calculate() {
            try { display.value = eval(display.value); }
            catch { display.value = 'Error'; }
        }
    </script>
</body>
</html>
