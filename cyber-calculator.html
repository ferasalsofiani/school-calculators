<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Neon Calculator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body {
            background-color: #0b0c10;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .calculator {
            background: #1f2833;
            border: 2px solid #66fcf1;
            box-shadow: 0 0 20px rgba(102, 252, 241, 0.4);
            padding: 20px;
            border-radius: 4px;
            width: 320px;
        }
        .title {
            color: #66fcf1;
            font-size: 0.9rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        #display {
            width: 100%;
            height: 60px;
            background: #0b0c10;
            border: 1px solid #45a29e;
            color: #66fcf1;
            font-size: 1.8rem;
            text-align: right;
            padding: 0 10px;
            margin-bottom: 15px;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            background: #0b0c10;
            border: 1px solid #45a29e;
            padding: 15px;
            font-size: 1.1rem;
            color: #c5c6c7;
            cursor: pointer;
            transition: 0.1s;
        }
        button:hover { background: #66fcf1; color: #0b0c10; box-shadow: 0 0 10px #66fcf1; }
        .operator { color: #66fcf1; border-color: #66fcf1; }
        .equal { background: #45a29e; color: #0b0c10; font-weight: bold; grid-column: span 2; }
        .equal:hover { background: #66fcf1; }
        .clear { color: #ff5555; border-color: #ff5555; }
        .clear:hover { background: #ff5555; color: #fff; box-shadow: 0 0 10px #ff5555; }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="title">// CYBER_CALC v1.0</div>
        <input type="text" id="display" readonly value="0">
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">CLS</button>
            <button onclick="appendValue('(')">[</button>
            <button onclick="appendValue(')')">]</button>
            <button class="operator" onclick="appendValue('/')">÷</button>
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('*')">×</button>
            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="operator" onclick="appendValue('-')">-</button>
            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="operator" onclick="appendValue('+')">+</button>
            <button onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
            <button class="equal" onclick="calculate()">EXEC</button>
        </div>
    </div>
    <script>
        const display = document.getElementById('display');
        function appendValue(val) {
            if (display.value === '0' || display.value === 'ERR') display.value = '';
            display.value += val;
        }
        function clearDisplay() { display.value = '0'; }
        function calculate() {
            try { 
                let expr = display.value.replace(/×/g, '*').replace(/÷/g, '/');
                display.value = eval(expr); 
            }
            catch { display.value = 'ERR'; }
        }
    </script>
</body>
</html>
